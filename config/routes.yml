creditjet_configuration:
  path: /creditjet/configure
  methods: [GET, POST]
  defaults:
    _controller: prestashop.module.creditjet.controller.credit_jet_configuration::index

credit_jet_create_schema:
  path: /creditjet/create-schema
  methods: [POST]
  defaults:
    _controller: prestashop.module.creditjet.controller.create_schema::create

credit_jet_delete_schema:
  path: /creditjet/delete-schema
  methods: [POST]
  defaults:
    _controller: prestashop.module.creditjet.controller.delete_schema::delete
