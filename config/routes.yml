credit_jet_configuration_form:
  path: /creditjet/configure
  methods: [GET, POST]
  defaults:
    _controller: prestashop.module.creditjet.controller.credit_jet_configuration::index
    _legacy_controller: AdminCreditJetConfiguration
    _legacy_link: AdminCreditJetConfiguration


creditjet_admin_create_schema:
  path: /creditjet/schema/create
  methods: [POST]
  defaults:
    _controller: prestashop.module.creditjet.controller.create_schema::create
    _legacy_controller: AdminCreditJetCreateSchema
    _legacy_link: AdminCreditJetCreateSchema

creditjet_admin_delete_schema:
  path: /creditjet/schema/delete
  methods: [POST]
  defaults:
    _controller: prestashop.module.creditjet.controller.delete_schema::delete
    _legacy_controller: AdminCreditJetDeleteSchema
    _legacy_link: AdminCreditJetDeleteSchema
