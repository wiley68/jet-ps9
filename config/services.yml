services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  # Form type
  prestashop.module.creditjet.form.type.creditjet_configuration:
    class: PrestaShop\Module\CreditJet\Form\CreditJetConfigurationType
    parent: form.type.translatable.aware
    public: true
    tags:
      - { name: form.type }

  prestashop.module.creditjet.form.creditjet_configuration_data_configuration:
    class: PrestaShop\Module\CreditJet\Form\CreditJetConfigurationDataConfiguration
    arguments:
      - '@prestashop.adapter.legacy.configuration'

  prestashop.module.creditjet.form.creditjet_configuration_form_data_provider:
    class: PrestaShop\Module\CreditJet\Form\CreditJetConfigurationFormDataProvider
    arguments:
      - '@prestashop.module.creditjet.form.creditjet_configuration_data_configuration'

  # Form handler
  prestashop.module.creditjet.creditjet_configuration_form_handler:
    class: PrestaShop\PrestaShop\Core\Form\Handler
    arguments:
      - '@form.factory'
      - '@prestashop.core.hook.dispatcher'
      - '@prestashop.module.creditjet.form.creditjet_configuration_form_data_provider'
      - 'PrestaShop\Module\CreditJet\Form\CreditJetConfigurationType'
      - 'CreditJetConfiguration'
    public: true

  # Admin controller as Symfony service (IMPORTANT)
  prestashop.module.creditjet.controller.credit_jet_configuration:
    class: PrestaShop\Module\CreditJet\Controller\CreditJetConfigurationController
    public: true
    arguments:
      - '@prestashop.module.creditjet.creditjet_configuration_form_handler'
    tags: ['controller.service_arguments']

  prestashop.module.creditjet.controller.create_schema:
    class: PrestaShop\Module\CreditJet\Controller\CreateSchemaController
    public: true
    tags: ['controller.service_arguments']

  prestashop.module.creditjet.controller.delete_schema:
    class: PrestaShop\Module\CreditJet\Controller\DeleteSchemaController
    public: true
    tags: ['controller.service_arguments']
